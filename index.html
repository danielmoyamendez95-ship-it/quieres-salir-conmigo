<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #09030c 0%, #1a0518 40%, #300619 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(224, 30, 132, 0.25) 0%, rgba(85, 107, 47, 0.2) 50%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        .container {

            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: rgba(18, 7, 22, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid #e01e84;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 0 35px rgba(224, 30, 132, 0.3), inset 0 0 15px rgba(200, 162, 200, 0.1);
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .badge {
            background: linear-gradient(90deg, #556b2f, #2e3b19);
            color: #e0d0f0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid #7c9a44;
            box-shadow: 0 0 10px rgba(85, 107, 47, 0.5);
        }

        .badge-capi {
            background: linear-gradient(90deg, #800020, #4a0013);
            border: 1px solid #e01e84;
            color: #ffb3de;
            box-shadow: 0 0 10px rgba(224, 30, 132, 0.5);
        }

        .svg-container {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(224, 30, 132, 0.4));
        }

        h1 {
            font-size: 24px;
            color: #f3e8f8;
            margin-bottom: 12px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(224, 30, 132, 0.5);
        }

        .subtitle {
            color: #c8a2c8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        }

        #yes-btn {
            background: linear-gradient(135deg, #556b2f 0%, #3e4f22 100%);
            color: #ffffff;
            border: 1px solid #8ab83e;
            box-shadow: 0 0 20px rgba(85, 107, 47, 0.6);
            z-index: 10;
        }
