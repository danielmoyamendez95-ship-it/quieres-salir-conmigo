<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Secreta #001 🛡️💚</title>
    <style>
        body {
            background-color: #1a0518;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .card {
            background-color: #120716;
            border: 3px solid #e01e84;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: #ffffff;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 0 25px rgba(224, 30, 132, 0.4);
        }
        .badge {
            background-color: #556b2f;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .badge-capi {
            background-color: #800020;
        }
        h1 {
            font-size: 22px;
            color: #f3e8f8;
            margin-bottom: 10px;
        }
        p {
            color: #c8a2c8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #yes-btn {
            background-color: #556b2f;
            color: white;
        }
        #no-btn {
            background-color: #800020;
            color: white;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card" id="question-screen">
        <div class="badge">Variante Loki 👑</div>
        <h1>¿Aceptas salir conmigo? 💖</h1>
        <p>Un propósito glorioso te espera...</p>
        <div class="buttons">
            <button id="yes-btn">¡ACEPTO!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div class="card hidden" id="success-screen">
        <div class="badge badge-capi">Capitán América 🛡️</div>
        <h1>¡Misión Aceptada! 💕</h1>
        <p>¡Tenemos una cita programada! ✨</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionScreen = document.getElementById('question-screen');
        const successScreen = document.getElementById('success-screen');

        const noMessages = ["No", "¿Segura?", "¡Por Asgard!", "Piénsalo bien", "¡Di que sí! 🥺"];
        let clickCount = 0;

        noBtn.addEventListener('click', () => {
            clickCount++;
            noBtn.textContent = noMessages[clickCount % noMessages.length];
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize * 1.25) + 'px';
        });

        yesBtn.addEventListener('click', () => {
            questionScreen.classList.add('hidden');
            successScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
