<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Secreta #001 🛡️💚</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #09030c 0%, #1a0518 40%, #300619 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(224, 30, 132, 0.25) 0%, rgba(85, 107, 47, 0.2) 50%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        .container {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: rgba(18, 7, 22, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #e01e84;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 0 35px rgba(224, 30, 132, 0.3), inset 0 0 15px rgba(200, 162, 200, 0.1);
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .badge {
            background: linear-gradient(90deg, #556b2f, #2e3b19);
            color: #e0d0f0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid #7c9a44;
            box-shadow: 0 0 10px rgba(85, 107, 47, 0.5);
        }

        .badge-capi {
            background: linear-gradient(90deg, #800020, #4a0013);
            border: 1px solid #e01e84;
            color: #ffb3de;
            box-shadow: 0 0 10px rgba(224, 30, 132, 0.5);
        }

        .svg-container {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(224, 30, 132, 0.4));
        }

        h1 {
            font-size: 24px;
            color: #f3e8f8;
            margin-bottom: 12px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(224, 30, 132, 0.5);
        }

        .subtitle {
            color: #c8a2c8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        }

        #yes-btn {
            background: linear-gradient(135deg, #556b2f 0%, #3e4f22 100%);
            color: #ffffff;
            border: 1px solid #8ab83e;
            box-shadow: 0 0 20px rgba(85, 107, 47, 0.6);
            z-index: 10;
        }

        #yes-btn:hover {
            background: linear-gradient(135deg, #688339 0%, #4c612a 100%);
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(138, 184, 62, 0.8);
        }

        #no-btn {
            background: linear-gradient(135deg, #800020 0%, #500014 100%);
            color: #f3e8f8;
            border: 1px solid #e01e84;
            box-shadow: 0 0 15px rgba(128, 0, 32, 0.5);
        }

        #no-btn:hover {
            background: linear-gradient(135deg, #a00028 0%, #66001a 100%);
        }

        .floating-icon {
            position: absolute;
            font-size: 26px;
            animation: floatUp 2s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <!-- Pestaña 1: Loki (Pregunta) -->
        <div id="question-screen" class="card">
            <div class="badge">Variante Loki 👑</div>
            <div class="svg-container">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="#120716" stroke="#556b2f" stroke-width="4"/>
                    <path d="M50 80 Q 20 20 60 40 Q 80 60 70 90 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
                    <path d="M150 80 Q 180 20 140 40 Q 120 60 130 90 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
                    <path d="M60 80 H 140 V 92 Q 100 105 60 92 Z" fill="#ffd700"/>
                    <circle cx="100" cy="120" r="45" fill="#fcd5ce"/>
                    <circle cx="82" cy="115" r="6" fill="#120716"/>
                    <path d="M112 115 L124 115" stroke="#120716" stroke-width="3" stroke-linecap="round"/>
                    <path d="M90 140 Q 100 150 110 140" stroke="#800020" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M55 120 Q 40 100 35 130 Q 50 140 60 130 Z" fill="#556b2f"/>
                    <path d="M145 120 Q 160 100 165 130 Q 150 140 140 130 Z" fill="#556b2f"/>
                </svg>
            </div>
            <h1>¿Aceptas salir conmigo? 💖</h1>
            <p class="subtitle">Propósito Glorioso te espera... ¿O vas a declinar la misión?</p>
            <div class="buttons">
                <button id="yes-btn">¡ACEPTO! 🛡️</button>
                <button id="no-btn">No</button>
            </div>
        </div>

        <!-- Pestaña 2: Capitán América (Éxito) -->
        <div id="success-screen" class="card hidden">
            <div class="badge badge-capi">Capitán América 🛡️</div>
            <div class="svg-container">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="85" fill="#800020"/>
                    <circle cx="100" cy="100" r="68" fill="#f3e8f8"/>
                    <circle cx="100" cy="100" r="51" fill="#800020"/>
                    <circle cx="100" cy="100" r="34" fill="#e01e84"/>
                    <path d="M100 78 L105 92 H120 L108 101 L112 115 L100 106 L88 115 L92 101 L80 92 H95 Z" fill="#ffffff"/>
                    <path d="M100 120 Q115 135 100 150 Q85 135 100 120 Z" fill="#e01e84"/>
                </svg>
            </div>
            <h1>¡Misión Aceptada! 💕</h1>
            <p class="subtitle">Podría hacer esto todo el día... ¡Tenemos una cita programada! ✨</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionScreen = document.getElementById('question-screen');
        const successScreen = document.getElementById('success-screen');

        const noMessages = [
            "No",
            "¿Piénsalo bien, Loki?",
            "¡Por Asgard!",
            "Esa no es una opción...",
            "¡Me rompes el corazón! 💔",
            "¡Exijo un evento canónico!",
            "¡Di que sí por favor! 🥺"
        ];

        let clickCount = 0;

        noBtn.addEventListener('click', () => {
            clickCount++;
            const messageIndex = clickCount % noMessages.length;
            noBtn.textContent = noMessages[messageIndex];

            const currentSize = window.getComputedStyle(yesBtn).fontSize;
            const newSize = parseFloat(currentSize) * 1.3;
            yesBtn.style.fontSize = `${newSize}px`;
            yesBtn.style.padding = `${14 * (newSize / 16)}px ${32 * (newSize / 16)}px`;
        });

        yesBtn.addEventListener('click', () => {
            questionScreen.classList.add('hidden');
            successScreen.classList.remove('hidden');

            const icons = ['🛡️', '👑', '💖', '✨', '💚'];
            setInterval(() => {
                const icon = document.createElement('div');
                icon.classList.add('floating-icon');
                icon.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                icon.style.left = Math.random() * 90 + 'vw';
                icon.style.bottom = '0px';
                document.body.appendChild(icon);

                setTimeout(() => {
                    icon.remove();
                }, 2000);
            }, 250);
        });
    </script>
</body>
</html>
